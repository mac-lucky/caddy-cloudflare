name: Docker Image for Caddy with Cloudflare DNS

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    with:
      app_name: "caddy-cloudflare"
      ghcr_image: "ghcr.io/mac-lucky/caddy-cloudflare"
      enable_security_scan: true
      govulncheck_binary: "/usr/bin/caddy"
      smoke_test_script: |
        docker run --rm "$SMOKE_IMAGE" caddy version
        docker run --rm "$SMOKE_IMAGE" caddy list-modules | grep -q dns.providers.cloudflare
